name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare offline language components
        shell: pwsh
        run: ./setup-offline.ps1
      - name: Build and test
        shell: pwsh
        run: ./test.ps1 -Integration
      - name: Package apps
        shell: pwsh
        run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Byby_Word_and_Excel-Windows-x64-offline
          path: dist/Byby_Word_and_Excel-Windows-x64-offline.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" dist/Byby_Word_and_Excel-Windows-x64-offline.zip --generate-notes

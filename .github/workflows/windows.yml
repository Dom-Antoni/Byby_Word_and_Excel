name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./test.ps1
      - name: Package apps
        shell: pwsh
        run: Compress-Archive -Path dist/Schreib.exe, dist/Tabelle.exe, README.md, LICENSE -DestinationPath dist/Byby_Word_and_Excel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Byby_Word_and_Excel-Windows
          path: |
            dist/Schreib.exe
            dist/Tabelle.exe
            dist/Byby_Word_and_Excel.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" dist/Schreib.exe dist/Tabelle.exe dist/Byby_Word_and_Excel.zip --generate-notes

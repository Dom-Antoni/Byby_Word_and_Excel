name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare offline language components
        shell: pwsh
        run: ./setup-offline.ps1
      - name: Build and test
        shell: pwsh
        run: ./test.ps1 -Integration
      - name: Package apps
        shell: pwsh
        run: ./package.ps1
      - name: Prepare installer compiler
        shell: pwsh
        run: ./setup-installer.ps1
      - name: Build setup assistants
        shell: pwsh
        run: ./build-installer.ps1
      - name: Test install, download, file types and uninstall
        shell: pwsh
        run: ./test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Byby_Word_and_Excel-Windows-x64-offline
          path: |
            dist/Byby_Word_and_Excel-Windows-x64-offline.zip
            dist/installers/Schreib-und-Tabelle-Setup.exe
            dist/installers/Schreib-und-Tabelle-Offline-Setup.exe
            dist/installers/SHA256SUMS.txt
      - name: Publish versioned download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = 'v' + $version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag und VERSION stimmen nicht überein.' }
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag existiert bereits und wird nicht überschrieben. Für ein neues öffentliches Update VERSION erhöhen."
            exit 0
          }
          gh release create $tag dist/installers/Schreib-und-Tabelle-Setup.exe dist/installers/Schreib-und-Tabelle-Offline-Setup.exe dist/Byby_Word_and_Excel-Windows-x64-offline.zip dist/installers/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "Schreib und Tabelle $version" --notes-file installer/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release konnte nicht veröffentlicht werden.' }
